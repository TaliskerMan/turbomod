# Change Comment (2026-11-15, TURB-9 / TURB-10 & CP-AnalyzerAndSonarHygiene / CP-ChangeComments):
# SonarQube Cloud Automatic Analysis configuration for turbomod with strictly
# disjoint `sonar.sources` (`.`) and `sonar.tests` (`tests`) scopes.
sonar.sources=.
sonar.tests=tests
sonar.test.inclusions=tests/**
sonar.exclusions=tests/**,Audit/**,preso/**,docs/*.pdf,docs/guide/package.json,build/**,dist/**,.scannerwork/**
